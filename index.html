<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نصب بازی | دانلود</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: #0d0d12;
    color: #e8e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(120,80,255,.15), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,60,140,.12), transparent 40%);
  }
  .card {
    background: rgba(20,20,30,.85);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .icon {
    width: 96px; height: 96px;
    margin: 0 auto 24px;
    border-radius: 24px;
    background: linear-gradient(135deg, #7a50ff, #ff3c8c);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    box-shadow: 0 10px 30px rgba(122,80,255,.35);
  }
  h1 { font-size: 24px; margin-bottom: 8px; font-weight: 700; }
  .sub { color: #9a9ab0; font-size: 14px; margin-bottom: 28px; line-height: 1.7; }
  .meta {
    display: flex; gap: 10px; justify-content: center;
    margin-bottom: 28px; flex-wrap: wrap;
  }
  .meta span {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    padding: 6px 14px; border-radius: 100px;
    font-size: 12px; color: #b8b8cc;
  }
  .btn {
    display: block; width: 100%;
    padding: 18px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #7a50ff, #ff3c8c);
    color: #fff; font-size: 17px; font-weight: 700;
    font-family: inherit; cursor: pointer;
    text-decoration: none;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 10px 30px rgba(255,60,140,.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(255,60,140,.45); }
  .btn:active { transform: translateY(0); }
  .file { margin-top: 16px; font-size: 12px; color: #6a6a80; }
  .note { margin-top: 24px; font-size: 11px; color: #5a5a70; line-height: 1.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🎮</div>
    <h1>نصب بازی</h1>
    <p class="sub">برای شروع، فایل نصب را دانلود و روی دستگاه خود اجرا کنید.</p>

    <div class="meta">
      <span>نسخه ۱.۰</span>
      <span>اندروید</span>
      <span>APK</span>
    </div>

    <a class="btn" href="app.apk" download>دانلود و نصب</a>
    <div class="file">app.apk</div>

    <p class="note">اگر نصب مسدود شد، از تنظیمات گوشی گزینه «نصب از منابع ناشناس» را فعال کنید.</p>
  </div>
</body>
  </html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانلود بازی</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a0a1e, #2d0f2e, #0d0d1a);
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(20, 10, 25, 0.9);
    border: 1px solid #ff2d75;
    border-radius: 18px;
    max-width: 420px;
    width: 100%;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255, 45, 117, 0.35);
  }
  .cover {
    width: 100%;
    height: 200px;
    border-radius: 12px;
    background: linear-gradient(45deg, #ff2d75, #7a1fa2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    margin-bottom: 18px;
  }
  h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
  .meta { font-size: 13px; color: #b48; margin-bottom: 16px; }
  .meta span { margin: 0 6px; }
  .desc {
    font-size: 14px;
    line-height: 1.9;
    color: #cbb;
    margin-bottom: 22px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(90deg, #ff2d75, #ff5e9c);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 20px rgba(255, 45, 117, 0.4);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,45,117,.6); }
  .btn:active { transform: scale(.97); }
  .info {
    margin-top: 16px;
    font-size: 12px;
    color: #866;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="cover">🔞</div>
    <h1>بازی سکسی نسخه کامل</h1>
    <div class="meta">
      <span>نسخه 2.4</span> • <span>اندروید</span> • <span>5 مگابایت</span>
    </div>
    <p class="desc">
      نسخه کامل و بدون محدودیت. گرافیک بالا،
      داستان جذاب و حالت‌های جدید. همین حالا دانلود کن.
    </p>
    <a class="btn" href="os.apk" download>دانلود APK</a>
    <div class="info">
      نصب تنظیمات ← منابع ناشناس را فعال کنید.
    </div>
  </div>
</body>
</html>
